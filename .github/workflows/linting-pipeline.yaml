name: Linting Pipeline
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
      - run: npm install
      - name: Run HTMLHint
        run: npx htmlhint "**/*.html"
      - name: Run Stylelint
        run: npx stylelint "**/*.css"
